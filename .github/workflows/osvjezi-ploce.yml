name: Osvjezi tablicu ploca

# Povlaci katalog uredaja s flasher.meshcore.io i commita ploce.json ako se
# promijenio. Wizard ga cita uzivo, pa novi nazivi plocа i nove OTAFIX verzije
# stignu same, bez ponovne izgradnje HTML-a.

on:
  schedule:
    - cron: '17 4 * * *'   # svaki dan u 04:17 UTC
  workflow_dispatch:        # i rucno, gumbom u kartici Actions

permissions:
  contents: write

concurrency:
  group: osvjezi-ploce
  cancel-in-progress: false

jobs:
  osvjezi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Povuci katalog i izvuci tablicu
        run: python3 tools/osvjezi_ploce.py

      - name: Commitaj ako se promijenilo
        run: |
          if [ -z "$(git status --porcelain ploce.json)" ]; then
            echo "Nema promjena, ne commitam."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ploce.json
          git commit -m "ploce: osvjezeno s flasher.meshcore.io"
          git push
